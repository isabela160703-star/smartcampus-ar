version: '3.8'

services:
  smartcampus-hci-web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smartcampus-ar-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  smartcampus-hci-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: smartcampus-ar-prod
    ports:
      - "8080:80"
    restart: unless-stopped
